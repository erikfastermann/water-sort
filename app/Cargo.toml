[package]
name = "water-sort-app"
version.workspace = true
edition.workspace = true

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
water-sort-core = { workspace = true, default-features = true }

[dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "default_app",
    "default_font",
    "2d_bevy_render",
    "ui_bevy_render",
    "png",
    "bevy_winit",
    "bevy_picking",
    "sprite_picking",
    "ui_picking",
    "mouse",
    "touch",
    "keyboard",
    "multi_threaded",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bevy]
version = "0.19"
default-features = false
features = ["x11", "wayland"]

[target.'cfg(target_arch = "wasm32")'.dependencies.bevy]
version = "0.19"
default-features = false
features = ["web", "webgl2"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Element",
    "CssStyleDeclaration",
] }
