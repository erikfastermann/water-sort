<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Water Sort" />
    <meta name="theme-color" content="#160b36" />
    <title>Water Sort</title>

    <link data-trunk rel="rust" data-wasm-opt="s" />
    <link data-trunk rel="copy-file" href="web/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="web/sw.js" />
    <link data-trunk rel="copy-dir" href="web/icons" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #160b36;
      }

      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* The canvas is full bleed so the starfield fills the notch and the home
         indicator strip; the wasm reads the insets off this probe and moves the
         header and nav bands instead. */
      #safe-area {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>

  <body>
    <div id="safe-area"></div>
    <canvas id="game"></canvas>

    <script>
      if ("serviceWorker" in navigator) {
        addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
      }
    </script>
  </body>
</html>
