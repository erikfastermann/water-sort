name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@v6

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/trunk
            target/web
            target/wasm32-unknown-unknown/web
          key: web-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            web-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-

      - name: Install the trunk version pinned in Trunk.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('app/Trunk.toml','rb'))['trunk-version'].lstrip('=^~>< '))")
          curl -sSfLo trunk.tar.gz \
            "https://github.com/trunk-rs/trunk/releases/download/v${version}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf trunk.tar.gz -C "$HOME/.local/bin" trunk
          rm trunk.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: trunk build --config app/Trunk.toml --locked --public-url "${BASE_PATH}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
