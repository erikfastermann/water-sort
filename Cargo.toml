[package]
name = "water-sort"
version = "0.1.0"
edition = "2024"

[features]
default = [
    "hidable_items",
    "lockable_items",
    "immovable_bottles",
    "pluggable_bottles",
    "freezable_bottles",
    "curtains",
    "safes",
    "lock_groups",
    "colored_bottles",
    "color_curtains",
]

hidable_items = []
lockable_items = []
immovable_bottles = []
pluggable_bottles = []
freezable_bottles = []
curtains = []
safes = []
lock_groups = []
colored_bottles = []
color_curtains = []

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
