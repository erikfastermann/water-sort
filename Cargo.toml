[workspace]
resolver = "3"
members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
water-sort-core = { path = "core", default-features = false }
itertools = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
